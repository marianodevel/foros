{% extends "base.html" %}
{% load static %}

{% block title %}Gestor SIPED{% endblock %}

{% block css %}
{{ block.super }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'siped/css/styles.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid pt-3">
    {% block header %}{% endblock %}

    <div id="flash-messages" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        {% include 'siped/_fragmento_mensajes.html' %}

    {% block siped_content %}{% endblock %}
</div>
{% endblock %}
